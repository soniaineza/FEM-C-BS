<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Kimu Operator</title>
<style>
  :root {
    --bg: #f5f6f7; --card: #ffffff; --ink: #111827; --muted: #5b6472; --line: #e2e5e9;
    --primary: #0e7c4a; --primary-ink: #ffffff; --danger: #b42318; --warn: #b54708; --warn-bg: #fff4e5;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111418; --card: #1b2026; --ink: #f1f3f5; --muted: #a3acb8; --line: #2c333c;
      --primary: #35b27a; --primary-ink: #06130c; --danger: #ff8a7a; --warn: #ffb866; --warn-bg: #33250f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0 12px; }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 16px; margin: 0 0 4px; }
  p { margin: 4px 0; }
  .muted { color: var(--muted); font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  nav { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  button { font: inherit; min-height: 44px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); font-weight: 600; }
  button.danger { border-color: var(--danger); color: var(--danger); }
  button[aria-pressed="true"] { border-color: var(--primary); color: var(--primary); font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 8px 0 4px; }
  input { font: inherit; width: 100%; min-height: 44px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .docs { list-style: none; padding: 0; margin: 8px 0 0; }
  .docs li { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .doc-preview { max-width: 100%; max-height: 360px; margin-top: 8px; border: 1px solid var(--line); border-radius: 8px; }
  .tag { font-size: 12px; font-weight: 600; }
  .tag.ok { color: var(--primary); } .tag.wait { color: var(--warn); } .tag.bad { color: var(--danger); }
  .notice { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; font-size: 14px; }
  .error { color: var(--danger); margin-top: 8px; font-size: 14px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Kimu Operator</h1>
    <button id="signout" hidden>Sign out</button>
  </header>

  <section id="login" class="card">
    <h2>Sign in</h2>
    <p class="muted">Sign in with your operator username and password. Your session is kept only in this browser tab.</p>
    <label for="username">Username</label>
    <input id="username" type="text" autocomplete="username">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password">
    <div class="row"><button id="enter" class="primary">Continue</button></div>
    <p id="loginError" class="error" role="alert"></p>
  </section>

  <section id="app" hidden>
    <nav aria-label="Sections">
      <button data-tab="drivers" aria-pressed="true">Drivers to approve</button>
      <button data-tab="cases" aria-pressed="false">Payment cases</button>
      <button data-tab="sos" aria-pressed="false">Emergencies</button>
      <button data-tab="integrations" aria-pressed="false">Integrations</button>
      <button id="reload">Refresh</button>
    </nav>
    <p id="status" class="muted" role="status"></p>
    <div id="list"></div>
  </section>
</main>

<script>
(function () {
  'use strict';
  var API = '/api/admin';
  var REQUIRED = ['license', 'national_id', 'vehicle_registration', 'insurance'];
  var DOC_NAMES = { license: 'Driving licence', national_id: 'National ID', vehicle_registration: 'Vehicle registration', insurance: 'Insurance', profile_photo: 'Profile photo', vehicle_photo: 'Vehicle photo', other: 'Other' };
  var tab = 'drivers';
  var refreshTimer = null;
  var $ = function (id) { return document.getElementById(id); };

  // Everything shown comes from riders and drivers, so it is only ever put
  // on the page as text, never as HTML.
  function el(tag, text, cls) {
    var node = document.createElement(tag);
    if (text != null) node.textContent = text;
    if (cls) node.className = cls;
    return node;
  }
  function button(text, cls, onClick) {
    var b = el('button', text, cls);
    b.addEventListener('click', onClick);
    return b;
  }
  function token() { return sessionStorage.getItem('kimuOperatorToken') || ''; }
  function who() { return sessionStorage.getItem('kimuOperatorName') || ''; }

  function call(method, path, body) {
    return fetch(API + path, {
      method: method,
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token() },
      body: body ? JSON.stringify(body) : undefined,
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (!res.ok) throw new Error(data.error || ('Request failed (' + res.status + ')'));
        return data;
      });
    });
  }
  function money(n) { return 'RWF ' + Math.round(Number(n) || 0).toLocaleString(); }
  function when(v) { return v ? new Date(v).toLocaleString() : ''; }
  function setStatus(text) { $('status').textContent = text; }

  // Runs one decision: disables the button, shows what happened, reloads.
  function act(btn, work) {
    btn.disabled = true;
    Promise.resolve().then(work).then(function () { load(); }).catch(function (err) {
      btn.disabled = false;
      setStatus('Not done: ' + err.message);
    });
  }
  function ask(question) { var v = window.prompt(question); return v == null ? null : v.trim(); }

  // ---- drivers ----
  function renderDrivers(data) {
    var list = $('list');
    if (!data.drivers.length) { list.appendChild(el('p', 'No drivers are waiting for approval.', 'muted')); return; }
    data.drivers.forEach(function (d) {
      var card = el('div', null, 'card');
      card.appendChild(el('h2', d.fullName || 'Driver'));
      card.appendChild(el('p', (d.phone || '') + ' · registered ' + when(d.createdAt), 'muted'));
      var latest = {};
      (d.documents || []).forEach(function (doc) { if (!latest[doc.docType]) latest[doc.docType] = doc; });
      var missing = REQUIRED.filter(function (t) { return !latest[t]; });
      var ul = el('ul', null, 'docs');
      REQUIRED.forEach(function (type) {
        var doc = latest[type];
        var li = el('li');
        var label = el('span', DOC_NAMES[type] + (doc && doc.fileName ? ' — ' + doc.fileName : ''));
        var state = !doc ? ['not submitted', 'wait'] : doc.status === 'approved' ? ['approved', 'ok'] : doc.status === 'rejected' ? ['rejected', 'bad'] : ['to check', 'wait'];
        var stateNode = el('span', state[0] + (doc && !doc.hasFile ? ' · file missing' : ''), 'tag ' + state[1]);
        li.appendChild(label);
        li.appendChild(stateNode);
        if (doc && doc.hasFile) {
          var preview = button('View file', '', function () {
            preview.disabled = true;
            fetch(API + '/documents/' + doc.id + '/file', {
              headers: { 'Authorization': 'Bearer ' + token() },
            }).then(function (res) {
              if (!res.ok) return res.json().catch(function () { return {}; }).then(function (data) {
                throw new Error(data.error || ('Could not load file (' + res.status + ')'));
              });
              return res.blob();
            }).then(function (blob) {
              var url = URL.createObjectURL(blob);
              var image = document.createElement('img');
              image.className = 'doc-preview';
              image.alt = DOC_NAMES[type] + ' preview';
              image.src = url;
              image.onload = function () { URL.revokeObjectURL(url); };
              if (blob.type.indexOf('image/') === 0) {
                card.appendChild(image);
              } else {
                var link = el('a', 'Open PDF: ' + (doc.fileName || DOC_NAMES[type]));
                link.href = url;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                card.appendChild(link);
              }
            }).catch(function (err) {
              setStatus('Could not load file: ' + err.message);
            }).finally(function () {
              preview.disabled = false;
            });
          });
          li.appendChild(preview);
        }
        ul.appendChild(li);
      });
      card.appendChild(ul);
      if (missing.length) {
        card.appendChild(el('p', 'Waiting for the driver to submit in the app: ' + missing.map(function (t) { return DOC_NAMES[t]; }).join(', ') + '.', 'muted'));
      }
      var row = el('div', null, 'row');
      var approve = button('I checked the originals — approve driver', 'primary', function () {
        var evidence = ask('Where is this inspection recorded? (for example: office log 12 Oct, page 3)');
        if (!evidence) return;
        act(approve, function () {
          return REQUIRED.reduce(function (chain, type) {
            return chain.then(function () {
              if (latest[type].status === 'approved') return null;
              return call('POST', '/documents/' + latest[type].id + '/review', { status: 'approved', reviewer: who(), method: 'in_person', evidenceReference: evidence });
            });
          }, Promise.resolve()).then(function () { return call('POST', '/drivers/' + d.id + '/verify'); });
        });
      });
      approve.disabled = missing.length > 0 || REQUIRED.some(function (type) {
        return !latest[type] || !latest[type].hasFile;
      });
      row.appendChild(approve);
      REQUIRED.forEach(function (type) {
        var doc = latest[type];
        if (!doc || doc.status !== 'pending') return;
        var reject = button('Reject ' + DOC_NAMES[type].toLowerCase(), 'danger', function () {
          var reason = ask('Why is it rejected? The driver will see this.');
          if (!reason) return;
          act(reject, function () { return call('POST', '/documents/' + doc.id + '/review', { status: 'rejected', reason: reason, reviewer: who() }); });
        });
        row.appendChild(reject);
      });
      card.appendChild(row);
      list.appendChild(card);
    });
  }

  // ---- payment cases ----
  var CASES = {
    cash_unconfirmed: { title: 'Cash not confirmed by the driver', help: 'The driver did not confirm the cash fare in time. Call the driver and the rider, then record what happened.', options: [['Cash was received', 'cash_received', 'primary'], ['Cash was NOT received', 'cash_not_received', 'danger']] },
    refund: { title: 'Money to send back', help: 'Paypack collected this money but it could not be applied to a ride or wallet. Send it back to the number shown, then record the transfer.', options: [['Refund sent', 'refunded', 'primary'], ['No refund is due', 'no_refund_due', '']] },
  };
  function renderCases(data) {
    var list = $('list');
    if (!data.exceptions.length) { list.appendChild(el('p', 'No open payment cases.', 'muted')); return; }
    data.exceptions.forEach(function (x) {
      var kind = x.reason === 'cash_unconfirmed' ? CASES.cash_unconfirmed : CASES.refund;
      var card = el('div', null, 'card');
      card.appendChild(el('h2', kind.title));
      card.appendChild(el('p', money(x.amount) + ' · ' + (x.method || '') + (x.phone ? ' · ' + x.phone : '') + ' · opened ' + when(x.created_at), 'muted'));
      card.appendChild(el('p', kind.help));
      card.appendChild(el('p', 'Reason recorded: ' + x.reason + (x.ride_id ? ' · ride ' + x.ride_id : ''), 'muted'));
      var row = el('div', null, 'row');
      kind.options.forEach(function (opt) {
        var b = button(opt[0], opt[2], function () {
          var reference = ask('Reference for this decision (transfer ID, call log, receipt number):');
          if (!reference) return;
          act(b, function () { return call('POST', '/payment-exceptions/' + x.id + '/resolve', { resolution: opt[1], reference: reference + ' — ' + who() }); });
        });
        row.appendChild(b);
      });
      card.appendChild(row);
      list.appendChild(card);
    });
  }

  // ---- emergencies ----
  function renderSos(data) {
    var list = $('list');
    if (!data.emergencies.length) { list.appendChild(el('p', 'No open emergencies.', 'muted')); return; }
    data.emergencies.forEach(function (e) {
      var card = el('div', null, 'card');
      card.appendChild(el('h2', 'SOS ' + (e.reference || '')));
      card.appendChild(el('p', (e.contact_role || 'Rider') + ' ' + (e.contact_name || '') + ' · ' + (e.contact_phone || 'unknown') + ' · ' + when(e.created_at), 'muted'));
      if (e.latitude != null && e.longitude != null) card.appendChild(el('p', 'Location: ' + e.latitude + ', ' + e.longitude + (e.address ? ' (' + e.address + ')' : '')));
      if (e.details) card.appendChild(el('p', e.details));
      var row = el('div', null, 'row');
      var done = button('Handled — close', 'primary', function () {
        if (!window.confirm('Close this emergency? Only do this after you have spoken to the rider.')) return;
        act(done, function () { return call('POST', '/emergencies/' + e.id + '/resolve'); });
      });
      row.appendChild(done);
      card.appendChild(row);
      list.appendChild(card);
    });
  }

  // ---- integrations (Google login, verification codes) ----
  function renderIntegrations(data) {
    var list = $('list');
    var g = data.google || {};
    var card = el('div', null, 'card');
    card.appendChild(el('h2', 'Google login'));
    card.appendChild(el('p', g.enabled ? 'Connected — the rider app shows "Continue with Google".' : 'Not configured — the rider app hides the Google button until the keys are set.', 'tag ' + (g.enabled ? 'ok' : 'wait')));
    card.appendChild(el('p', 'Client ID: ' + (g.clientId || 'not set'), 'muted'));
    card.appendChild(el('p', 'Authorized redirect URI to register in the Google Cloud console: ' + (g.redirectUri || 'not available — set PUBLIC_URL on the server'), 'muted'));
    card.appendChild(el('p', 'The app returns through ' + g.appReturnUrl + (g.webReturnUrl ? ' (phones) and ' + g.webReturnUrl + ' (web)' : '') + '.', 'muted'));
    card.appendChild(el('p', 'To enable: create a "Web application" OAuth client in the Google Cloud console with that redirect URI, then set GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET in the server environment and restart. Nothing in the apps needs to change.', 'muted'));
    list.appendChild(card);

    var o = data.otp || {};
    var wa = o.whatsapp || {};
    var sms = o.sms || {};
    var otp = el('div', null, 'card');
    otp.appendChild(el('h2', 'Verification codes (OTP)'));
    var line;
    if (wa.active) line = ['WhatsApp: connected — codes go to WhatsApp' + (sms.configured ? ', with SMS (' + sms.provider + ') as the fallback.' : '. No SMS fallback.'), 'ok'];
    else if (o.channel === 'whatsapp') line = ['WhatsApp: selected but not configured — set WHATSAPP_ACCESS_TOKEN and WHATSAPP_PHONE_NUMBER_ID.', 'wait'];
    else line = ['WhatsApp: off (OTP_CHANNEL=sms).' + (sms.configured ? ' Codes go by SMS through ' + sms.provider + '.' : ''), sms.configured ? 'ok' : 'wait'];
    otp.appendChild(el('p', line[0], 'tag ' + line[1]));
    otp.appendChild(el('p', 'Template ' + (wa.template || '—') + ' · language ' + (wa.language || '—') + ' · phone number ID ' + (wa.phoneNumberId || 'not set') + ' · Graph API ' + (wa.apiVersion || '—'), 'muted'));
    if (!o.ready) otp.appendChild(el('p', 'No delivery channel is configured: riders cannot receive codes on this server.', 'error'));
    var label = el('label', 'Send yourself a test code (international format)');
    label.htmlFor = 'testPhone';
    var input = el('input');
    input.id = 'testPhone';
    input.type = 'tel';
    input.placeholder = '+2507XXXXXXXX';
    input.autocomplete = 'tel';
    var row = el('div', null, 'row');
    var send = button('Send test code', 'primary', function () {
      var phone = input.value.trim();
      if (!phone) { setStatus('Enter a phone number first.'); return; }
      send.disabled = true;
      setStatus('Sending…');
      call('POST', '/integrations/otp/test', { phone: phone })
        .then(function (r) { setStatus(r.message); })
        .catch(function (err) { setStatus('Not sent: ' + err.message); })
        .finally(function () { send.disabled = false; });
    });
    row.appendChild(send);
    otp.appendChild(label);
    otp.appendChild(input);
    otp.appendChild(row);
    list.appendChild(otp);
  }

  var TABS = {
    drivers: { path: '/drivers?verified=false', render: renderDrivers },
    cases: { path: '/payment-exceptions', render: renderCases },
    sos: { path: '/emergencies', render: renderSos },
    // Static settings and a form: no automatic refresh (it would wipe the input).
    integrations: { path: '/integrations', render: renderIntegrations, noRefresh: true },
  };

  function load() {
    $('list').textContent = '';
    setStatus('Loading…');
    return call('GET', TABS[tab].path).then(function (data) {
      setStatus('Updated ' + new Date().toLocaleTimeString());
      TABS[tab].render(data);
    }).catch(function (err) { setStatus('Could not load: ' + err.message); throw err; })
      .finally(scheduleRefresh);
  }

  function stopRefresh() {
    if (refreshTimer) clearTimeout(refreshTimer);
    refreshTimer = null;
  }

  function scheduleRefresh() {
    stopRefresh();
    if (!token() || document.hidden || TABS[tab].noRefresh) return;
    refreshTimer = setTimeout(function () {
      refreshTimer = null;
      load().catch(function () {});
    }, 15000);
  }

  function show(signedIn) {
    $('login').hidden = signedIn;
    $('app').hidden = !signedIn;
    $('signout').hidden = !signedIn;
  }

  $('enter').addEventListener('click', function () {
    var username = $('username').value.trim();
    var password = $('password').value;
    $('loginError').textContent = '';
    if (!username || !password) { $('loginError').textContent = 'Enter your username and password.'; return; }
    fetch(API + '/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: username, password: password }),
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (!res.ok) throw new Error(data.error || 'Sign-in failed.');
        sessionStorage.setItem('kimuOperatorToken', data.token);
        sessionStorage.setItem('kimuOperatorName', data.name);
        $('password').value = '';
        show(true);
        return load();
      });
    }).catch(function (err) {
      sessionStorage.removeItem('kimuOperatorToken');
      show(false);
      $('loginError').textContent = err.message;
    });
  });
  $('signout').addEventListener('click', function () {
    stopRefresh();
    sessionStorage.removeItem('kimuOperatorToken');
    sessionStorage.removeItem('kimuOperatorName');
    $('password').value = '';
    show(false);
  });
  $('reload').addEventListener('click', function () { load().catch(function () {}); });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stopRefresh();
    else if (token()) load().catch(function () {});
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-tab]'), function (b) {
    b.addEventListener('click', function () {
      tab = b.getAttribute('data-tab');
      Array.prototype.forEach.call(document.querySelectorAll('[data-tab]'), function (o) { o.setAttribute('aria-pressed', String(o === b)); });
      load().catch(function () {});
    });
  });

  if (token()) { show(true); load().catch(function () { sessionStorage.removeItem('kimuOperatorToken'); show(false); }); }
})();
</script>
</body>
</html>
