# Render blueprint for the Kimu Transport API (https://render.com/docs/blueprint-spec).
#
# `starter` is Render's smallest paid instance: unlike `free` it never sleeps,
# so there is no ~24s cold start on the first request after idle.
#
# Existing service: rather than syncing this blueprint (which would create a
# second service), switch the current service's Instance Type to Starter in
# the Render dashboard and add the env vars below under Environment.
# The server refuses to start in production if any required one is missing.
services:
  - type: web
    name: fem-cabs-api
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci && ./node_modules/.bin/expo export --platform web && cd server && npm ci --omit=dev
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # One proxy hop in front of the API, so rate limits see the real client IP.
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: EXPO_PUBLIC_API_BASE_URL
        value: https://fem-cabs-api.onrender.com/api
      - key: OSRM_URL
        sync: false
      - key: PHOTON_URL
        sync: false
      - key: PHOTON_REVERSE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      # OTP SMS: pindo | africastalking | generic
      - key: SMS_PROVIDER
        sync: false
      - key: SMS_API_KEY
        sync: false
      - key: SMS_SENDER_NAME
        sync: false
      # Paypack mobile money; webhook URL: https://<host>/api/webhooks/paypack
      - key: PAYPACK_CLIENT_ID
        sync: false
      - key: PAYPACK_CLIENT_SECRET
        sync: false
      - key: PAYPACK_WEBHOOK_SECRET
        sync: false
      - key: EMERGENCY_CALL_CENTER_PHONE
        sync: false
      - key: DEV_REVEAL_CODES
        value: "0"
      - key: DEMO_PAYMENTS
        value: "0"
      # Real drivers only: never run the simulated fleet on the hosted API.
      - key: DEMO_FLEET
        value: "0"
      - key: DEV_AUTO_VERIFY_DRIVERS
        value: "0"
