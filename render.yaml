services:
  - type: web
    name: fem-cabs-api
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci && ./node_modules/.bin/expo export --platform web && cd server && npm ci --omit=dev
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: EXPO_PUBLIC_API_BASE_URL
        value: https://fem-cabs-api.onrender.com/api
      - key: OSRM_URL
        sync: false
      - key: PHOTON_URL
        sync: false
      - key: PHOTON_REVERSE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # OTP SMS: pindo | africastalking | generic
      - key: SMS_PROVIDER
        sync: false
      - key: SMS_API_KEY
        sync: false
      - key: SMS_SENDER_NAME
        sync: false
      # Paypack mobile money; webhook URL: https://<host>/api/webhooks/paypack
      - key: PAYPACK_CLIENT_ID
        sync: false
      - key: PAYPACK_CLIENT_SECRET
        sync: false
      - key: PAYPACK_WEBHOOK_SECRET
        sync: false
      - key: EMERGENCY_CALL_CENTER_PHONE
        sync: false
      - key: DEV_REVEAL_CODES
        value: "0"
